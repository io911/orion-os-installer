name: Build Orion OS Installer ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  GHCR_OWNER: io911   # <-- set this to your GHCR owner/org (e.g. io911)
  IMAGE_NAME: orion-bootc
  ISO_MAX_BYTES: 2147483648

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry (if needed) and pull orion-bootc image
        run: |
          set -eux
          # Login so podman can pull private GHCR images; ignore failure if login isn't needed.
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin || true
          IMAGE_FULL="ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:latest"
          sudo podman pull "${IMAGE_FULL}"
          echo "Pulled ${IMAGE_FULL}"

      - name: Create hybrid installer ISO
        run: |
          set -eux
          IMAGE_FULL="ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:latest"
          DATE_SUFFIX=$(date -u +"%y%m%d")
          OUT_PATH="$GITHUB_WORKSPACE/orion-os-installer-${DATE_SUFFIX}.iso"
          mkdir -p "$(dirname "${OUT_PATH}")"

          # Build ISO using bootc-image-builder
          sudo podman run --rm --privileged \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$GITHUB_WORKSPACE":/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs ext4 \
            --output /output \
            "${IMAGE_FULL}"

          # Locate the generated ISO (bootc-image-builder outputs install.iso in subfolders)
          GENERATED_ISO=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "*.iso" ! -name "orion-os-installer-*.iso" | head -n 1)

          if [ -n "${GENERATED_ISO}" ]; then
            mv "${GENERATED_ISO}" "${OUT_PATH}"
          else
            echo "Error: Could not locate generated ISO file."
            exit 1
          fi

          ls -lh "${OUT_PATH}"
          
      - name: Check ISO size and fail if >= 2GB
        run: |
          OUT_FILE=$(ls $GITHUB_WORKSPACE/orion-os-installer-*.iso | tail -n1)
          if [ -z "${OUT_FILE:-}" ]; then
            echo "No ISO found to check"
            exit 1
          fi
          ISO_SIZE=$(stat -c%s "${OUT_FILE}")
          echo "ISO size: ${ISO_SIZE} bytes"
          if [ ${ISO_SIZE} -ge ${{ env.ISO_MAX_BYTES }} ]; then
            echo "ISO is too large (>= 2GB). Aborting upload."
            exit 1
          fi

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-os-installer-iso
          path: $GITHUB_WORKSPACE/orion-os-installer-*.iso
